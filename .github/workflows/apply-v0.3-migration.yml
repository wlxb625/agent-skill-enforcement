name: Apply ASEP 0.3 snapshot

on:
  push:
    branches: [main]
    paths:
      - '.asep-migration/**'
      - '.github/workflows/apply-v0.3-migration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct snapshot
        run: |
          cat .asep-migration/chunk-* | base64 --decode > /tmp/asep-v0.3.zip
          rm -rf /tmp/asep-v0.3
          mkdir -p /tmp/asep-v0.3
          unzip -q /tmp/asep-v0.3.zip -d /tmp/asep-v0.3
      - name: Replace repository contents
        run: |
          rsync -a --delete --exclude='.git/' /tmp/asep-v0.3/agent-skill-enforcement-v0.3.0-draft/ ./
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish ASEP 0.3 adherence-first draft'
            git push origin HEAD:main
          fi
