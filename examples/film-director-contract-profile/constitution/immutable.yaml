version: "0.1.0"
priority: [immutable, adaptive, task, model-local]
protected_paths:
  - execution.stages
  - execution.transitions
  - execution.completion
  - gates.required
  - gates.minimum_scores
hard_constraints:
  - id: no-final-before-script-gates
    enforcement: hard
    description: A final screenplay cannot be delivered before all required script gates pass.
  - id: adaptive-cannot-lower-quality
    enforcement: hard
    description: User preferences cannot lower protected quality thresholds.
adaptive_permissions:
  allowed_paths:
    - preferences.genre
    - preferences.tone
    - preferences.audience
    - preferences.rejected_patterns
  denied_operations:
    - remove-required-gate
    - reduce-threshold
    - force-character-age-without-story-fit
integrity:
  mode: optional-hashes
