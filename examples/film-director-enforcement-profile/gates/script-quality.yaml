id: script-quality
description: Final screenplay quality and continuity gate.
stage: script
required: true
validators:
  - id: script-schema
    type: schema
    config: {schema: schemas/script.schema.json}
evaluators:
  - id: script-reviewer
    type: semantic
    rubric: evaluators/script.md
    minimum_attestation: self_assessed
    required: true
logic: ALL
decision:
  hard_fail_override: true
  pass_when: {minimum_score: 80}
transitions:
  PASS: COMPLETE
  CONDITIONAL: script
  FAIL: treatment
repair:
  return_stage: script
