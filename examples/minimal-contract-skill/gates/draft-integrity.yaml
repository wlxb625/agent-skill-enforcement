id: draft-integrity
description: Deterministic integrity checks for claim and source references.
stage: draft
required: true
validators:
  - id: draft-schema
    type: schema
    config:
      schema: schemas/draft.schema.json
  - id: source-reference-check
    type: reference
    config:
      from: claims[].source_ids[]
      to: sources[].id
evaluators: []
logic: ALL
decision:
  hard_fail_override: true
  pass_when:
    validators_valid: true
transitions:
  PASS: review
  CONDITIONAL: draft
  FAIL: FAILED
repair:
  return_stage: draft
  must_change: [missing fields, invalid source references]
  preserve: [valid claims and sources]
