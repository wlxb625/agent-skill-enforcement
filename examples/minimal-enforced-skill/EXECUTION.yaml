enforcement:
  protocol: ASEP
  spec_version: "0.2.0-draft"
  kind: enforced-agent-skill
  name: evidence-brief
  version: "0.2.0"
  description: Minimal three-stage Enforced Skill example.

compatibility:
  ordinary_skill: true
  fallback_mode: soft-enforcement
  minimum_execution_level: L1

policy_layers:
  immutable: constitution/immutable.yaml
  adaptive:
    default: adaptive/default-policy.yaml
    schema: adaptive/policy.schema.json
    patch_schema: schemas/policy-patch.schema.json

state:
  controlled_by: bundled-script
  start_stage: draft
  storage: .asep/state.json

stages:
  - id: draft
    instruction: stages/draft.md
    output_schema: schemas/draft.schema.json
    gates: [draft-integrity]
    max_repair_rounds: 2
  - id: review
    instruction: stages/review.md
    output_schema: schemas/review.schema.json
    gates: [evidence-quality]
    max_repair_rounds: 2
  - id: final
    instruction: stages/final.md
    output_schema: schemas/final.schema.json
    gates: []

gates:
  - gates/draft-integrity.yaml
  - gates/evidence-quality.yaml

transitions:
  draft:
    PASS: review
    CONDITIONAL: draft
    FAIL: FAILED
  review:
    PASS: final
    CONDITIONAL: draft
    FAIL: FAILED
  final:
    PASS: COMPLETE
    FAIL: FAILED

completion:
  terminal_stage: COMPLETE
  receipt_schema: schemas/completion-receipt.schema.json
  requires_stages: [draft, review, final]
  requires_gates: [draft-integrity, evidence-quality]
  minimum_attestation: self_assessed
