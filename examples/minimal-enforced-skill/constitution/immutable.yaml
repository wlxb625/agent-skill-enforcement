version: "0.1.0"
priority: [immutable, adaptive, task, model-local]
protected_paths:
  - execution.stages
  - execution.transitions
  - execution.completion
  - gates.required
  - gates.thresholds
hard_constraints:
  - id: no-unsupported-final-claim
    enforcement: hard
    description: Every final factual claim must cite supplied evidence.
  - id: final-requires-review
    enforcement: hard
    description: Final output cannot be released before evidence-quality passes.
adaptive_permissions:
  allowed_paths:
    - preferences.tone
    - preferences.length
    - preferences.terminology
  denied_operations:
    - disable-required-stage
    - reduce-threshold
    - remove-required-gate
    - expand-tool-permission
integrity:
  mode: optional-hashes
