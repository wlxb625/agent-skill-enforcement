[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "asep-validator"
version = "0.3.0"
description = "Validate Agent Skills with optional Agent Skill Enforcement adherence profiles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20"
]

[project.scripts]
asep = "asep.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asep = ["schemas/*.json"]
