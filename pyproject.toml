[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-skills-validator"
version = "0.1.0"
description = "Reference validator for the Contract Skills draft specification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20"
]

[project.scripts]
contract-skill = "contract_skills.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_skills = ["schemas/*.json"]
